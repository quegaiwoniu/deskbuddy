name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.6.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Verify signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build signed update and installer
        run: npm run tauri -- build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple 签名配置后按需加回；不存在的 Secret 会以空串传入导致证书导入失败
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskBuddy-${{ env.RELEASE_TAG }}-macOS
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build signed update and installer
        run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskBuddy-${{ env.RELEASE_TAG }}-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: DeskBuddy-${{ env.RELEASE_TAG }}-macOS
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: DeskBuddy-${{ env.RELEASE_TAG }}-Windows
          path: release/windows
      - name: Prepare update manifest
        run: |
          python3 scripts/update_manifest.py \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --archive release/macos/DeskBuddy.app.tar.gz \
            --signature release/macos/DeskBuddy.app.tar.gz.sig \
            --windows-setup "release/windows/DeskBuddy_${RELEASE_TAG#v}_x64-setup.exe" \
            --windows-signature "release/windows/DeskBuddy_${RELEASE_TAG#v}_x64-setup.exe.sig" \
            --notes "docs/releases/$RELEASE_TAG.md" \
            --output release/latest.json
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "DeskBuddy $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" \
            release/macos/*.dmg \
            release/macos/*.tar.gz \
            release/macos/*.sig \
            release/windows/*-setup.exe \
            release/windows/*.sig \
            release/latest.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
